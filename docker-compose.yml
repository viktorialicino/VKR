services:
  postgres:
    image: postgres:16
    container_name: ob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: office_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d office_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
